name: Release

# Creates a tag + GitHub Release (vX.Y.Z) whenever the version in manifest.json changes.
# HACS detects updates only via GitHub Releases.

on:
  push:
    branches: [main]
    paths:
      - custom_components/ha_datakom/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r .version custom_components/ha_datakom/manifest.json)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release if tag does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
